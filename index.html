<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust Chat App</title>
  <style>
    :root {
      --primary: #0084ff;
      --text: #333;
      --border: #e5e5e5;
      --bg: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    .login {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), #0052cc);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .login-card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .login-card h1 {
      color: var(--primary);
      font-size: 24px;
      margin-bottom: 10px;
    }

    .login-card p {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .login-card input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 132, 255, 0.1);
    }

    .login-card button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .sidebar {
      width: 270px;
      background: white;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .btn-new {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #room-list {
      flex: 1;
      overflow-y: auto;
      padding: 5px;
    }

    .room-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.2s;
    }

    .room-item:hover {
      background: var(--bg);
    }

    .room-item.active {
      background: #e7f3ff;
    }

    .room-avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      margin-right: 10px;
      flex-shrink: 0;
      font-size: 16px;
    }

    .room-info {
      flex: 1;
      min-width: 0;
    }

    .room-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }

    .room-msg {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .btn-leave {
      background: var(--bg);
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }

    #chat-window {
      flex: 1;
      padding: 15px 20px;
      overflow-y: auto;
    }

    .empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: auto;
      color: #ccc;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .msg-group {
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .msg-group.own {
      justify-content: flex-end;
    }

    .msg-group.system {
      justify-content: center;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .msg-group.own .msg-avatar {
      display: none;
    }

    .msg-user-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0 4px 0;
      margin-top: 8px;
    }

    .msg-username {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .msg {
      padding: 8px 12px;
      border-radius: 12px;
      background: #f0f0f0;
      max-width: 65%;
      font-size: 14px;
      line-height: 1.4;
      color: var(--text);
      word-wrap: break-word;
    }

    .msg-group.own .msg {
      background: var(--primary);
      color: white;
    }

    .msg-group.system .msg {
      background: transparent;
      color: #999;
      font-size: 12px;
      font-style: italic;
      padding: 0;
    }

    .input-area {
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    #message-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
    }

    #message-input::placeholder {
      color: #bbb;
    }

    #message-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 132, 255, 0.1);
    }

    .btn-send {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #999;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="login" class="login-card">
    <h1 id="auth-title">Rust Chat App</h1>
    <p id="auth-desc">Vui lòng đăng nhập hệ thống</p>
    
    <input id="username-input" type="text" placeholder="Tên đăng nhập..." maxlength="50">
    <input id="password-input" type="password" placeholder="Mật khẩu..." maxlength="50">
    
    <div id="auth-buttons" style="display: flex; flex-direction: column; gap: 10px;">
        <button id="btn-primary" onclick="handleAuth(isLoginMode ? 'login' : 'register')">Đăng nhập</button>
        <button id="btn-secondary" onclick="handleAuth('register')" 
                style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">
            Tạo tài khoản mới
        </button>
    </div>
    
    <div id="auth-toggle" style="margin-top: 15px; font-size: 13px;">
        <a href="#" onclick="toggleAuthMode()" id="toggle-link" style="color: var(--primary); text-decoration: none;">
            Chưa có tài khoản? Đăng ký ngay
        </a>
    </div>
</div>

    <div class="sidebar hidden" id="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <div style="display: flex; gap: 6px;">
          <button class="btn-new" onclick="createRoomChat()" style="flex: 1;">Phòng</button>
          <button class="btn-new" onclick="createPrivateChat()" style="flex: 1;">Riêng</button>
        </div>
      </div>
      <div id="room-list"></div>
    </div>

    <div class="chat hidden" id="chat-screen">
      <div class="chat-header">
        <h3 id="room-title"># general</h3>
        <button class="btn-leave" onclick="handleLeave()">Rời phòng</button>
      </div>
      <div id="chat-window">
        <div class="empty"></div>
      </div>
      <div class="input-area">
        <input id="message-input" type="text" placeholder="Nhập tin nhắn..." maxlength="500"
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()">Gửi</button>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let username = "";
    let currentRoom = null;
    let joinedRooms = new Map();
    let lastUser = "";
    let suppressCloseAlert = false;
    let isLoginMode = true;

    const chatWindow = document.getElementById("chat-window");
    const roomTitle = document.getElementById("room-title");
    const roomList = document.getElementById("room-list");
    const messageInput = document.getElementById("message-input");
    const loginScreen = document.getElementById("login");
    const sidebar = document.getElementById("sidebar");
    const chatScreen = document.getElementById("chat-screen");

    function privateRoomId(left, right) {
        const participants = [left.trim(), right.trim()].sort();
        return `dm:${participants[0]}:${participants[1]}`;
    }

    function isPrivateRoom(room) { return room && room.startsWith("dm:"); }

    function getPrivateTarget(room) {
        if (!isPrivateRoom(room)) return "";
        const participants = room.replace("dm:", "").split(":");
        return participants.find((name) => name !== username) || username;
    }

    function displayRoomName(room) { return isPrivateRoom(room) ? `@${getPrivateTarget(room)}` : room; }

    function roomAvatar(room) {
        const label = displayRoomName(room);
        return label[0] ? label[0].toUpperCase() : "?";
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        const title = document.getElementById("auth-title");
        const desc = document.getElementById("auth-desc");
        const btnPrimary = document.getElementById("btn-primary");
        const btnSecondary = document.getElementById("btn-secondary");
        const toggleLink = document.getElementById("toggle-link");

        if (isLoginMode) {
            title.innerText = "Rust Chat App";
            desc.innerText = "Vui lòng đăng nhập hệ thống";
            btnPrimary.innerText = "Đăng nhập";
            btnPrimary.style.display = "block";
            btnSecondary.style.display = "block";
            btnSecondary.innerText = "Tạo tài khoản mới";
            toggleLink.innerText = "Chưa có tài khoản? Đăng ký ngay";
        } else {
            title.innerText = "Đăng ký tài khoản";
            desc.innerText = "Tham gia cộng đồng Rust";
            btnPrimary.innerText = "Xác nhận Đăng ký";
            btnSecondary.style.display = "none";
            toggleLink.innerText = "Đã có tài khoản? Đăng nhập";
        }
    }

    function handleAuth(mode) {
        username = document.getElementById("username-input").value.trim();
        const password = document.getElementById("password-input").value.trim();

        if (!username || !password) {
            alert("Vui lòng nhập đầy đủ thông tin");
            return;
        }

        // Khởi tạo kết nối WebSocket nếu chưa có
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            ws = new WebSocket(`ws://${location.hostname}:3000/ws`);
            
            ws.onopen = () => {
                sendAuthRequest(mode, username, password);
            };

            ws.onmessage = handleServerMessage; // Chuyển logic onmessage ra hàm riêng
            ws.onclose = () => {
                if (!suppressCloseAlert) alert("Mất kết nối tới Server");
                resetApp();
            };
        } else {
            sendAuthRequest(mode, username, password);
        }
    }

    function sendAuthRequest(mode, user, pass) {
        // mode sẽ là 'login' hoặc 'register'
        const authData = {
            msg_type: mode, 
            username: user,
            password: pass,
            content: mode === "register" ? "Yêu cầu đăng ký mới" : "Yêu cầu đăng nhập",
            room: "general",
            target: "",
            users: []
        };
        ws.send(JSON.stringify(authData));
    }

    function handleServerMessage(e) {
        const data = JSON.parse(e.data);
        
        if (data.msg_type === "error") {
        alert("Thông báo: " + data.content);
        return; 
      }

        // Logic chuyển màn hình khi Đăng ký/Đăng nhập thành công
        // Server nên gửi msg_type: "system" và content chứa chữ "thành công"
        if (data.msg_type === "system" && data.content.toLowerCase().includes("thành công")) {
            alert(data.content);
            if (isLoginMode === false) {
                toggleAuthMode(); // Chuyển về màn hình Đăng nhập sau khi đăng ký xong
            } else {
                loginScreen.classList.add("hidden");
                sidebar.classList.remove("hidden");
                chatScreen.classList.remove("hidden");
                joinRoom("general");
            }
        }

        // Lưu và hiển thị tin nhắn như cũ
        if (!joinedRooms.has(data.room)) {
            joinedRooms.set(data.room, { msgs: [] });
        }
        joinedRooms.get(data.room).msgs.push(data);
        renderSidebar();

        if (data.room === currentRoom) {
            renderMessage(data);
        }
    }

    function resetApp() {
      ws = null;
      currentRoom = null;
      joinedRooms = new Map();
      lastUser = "";
      suppressCloseAlert = false;
      roomList.innerHTML = "";
      chatWindow.innerHTML = '<div class="empty"></div>';
      loginScreen.classList.remove("hidden");
      sidebar.classList.add("hidden");
      chatScreen.classList.add("hidden");
    }

    function connect() {
        username = document.getElementById("username-input").value.trim();
        const password = document.getElementById("password-input").value.trim();

        if (!username || !password) {
            alert("Vui lòng nhập đầy đủ tài khoản và mật khẩu");
            return;
        }

        // Đổi IP/Port tương ứng với Server Rust của bạn
        ws = new WebSocket(`ws://${location.hostname}:3000/ws`);

        ws.onopen = () => {
            // Gửi bản tin Login - Phải khớp với Struct ChatMessage trong Rust
            const loginData = {
                msg_type: "login",
                username: username,
                password: password, // MSSQL sẽ check pass này
                content: "đang đăng nhập...",
                room: "general",
                target: "",
                users: []
            };
            ws.send(JSON.stringify(loginData));
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            
            // Xử lý lỗi từ Backend (Ví dụ: Sai pass SQL)
            if (data.msg_type === "error") {
                alert("Lỗi hệ thống: " + data.content);
                suppressCloseAlert = true;
                ws.close();
                return;
            }

            // Khi Login thành công, server thường gửi tin nhắn system
            if (loginScreen.classList.contains("hidden") === false) {
                loginScreen.classList.add("hidden");
                sidebar.classList.remove("hidden");
                chatScreen.classList.remove("hidden");
                joinRoom("general");
            }

            // Lưu trữ và hiển thị tin nhắn
            if (!joinedRooms.has(data.room)) {
                joinedRooms.set(data.room, { msgs: [] });
            }
            joinedRooms.get(data.room).msgs.push(data);
            renderSidebar();

            if (data.room === currentRoom) {
                renderMessage(data);
            }
        };

        ws.onclose = () => {
            if (!suppressCloseAlert) alert("Mất kết nối tới Server ACE Store");
            resetApp();
        };
    }

    function joinRoom(room) {
      if (joinedRooms.has(room)) {
        switchRoom(room);
        return;
      }

      joinedRooms.set(room, { msgs: [] });
      ws.send(JSON.stringify({
        msg_type: "join",
        username: username,
        password: "", // Không cần mật khẩu khi join room
        room: room,
        content: "",
        target: "",
        users: []
      }));
      switchRoom(room);
    }

    function switchRoom(room) {
      currentRoom = room;
      lastUser = "";
      roomTitle.textContent = isPrivateRoom(room) ? displayRoomName(room) : `# ${room}`;
      renderSidebar();
      renderMessages();
    }

    function sendMessage() {
        const input = document.getElementById("message-input");
        const content = input.value.trim();
        if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

        const target = isPrivateRoom(currentRoom) ? getPrivateTarget(currentRoom) : "";

        // Cấu trúc chuẩn để lưu vào SQL Server
        const msg = {
            msg_type: "message",
            username: username,
            password: "", // Không gửi pass khi chat
            content: content,
            room: currentRoom,
            target: target,
            users: []
        };

        ws.send(JSON.stringify(msg));
        input.value = "";
    }

    function handleLeave() {
      if (!currentRoom || currentRoom === "general") {
        alert("Không thể rời khỏi phòng chung");
        return;
      }

      ws.send(JSON.stringify({
        msg_type: "leave",
        username: username,
        password: "",
        room: currentRoom,
        content: "",
        target: "",
        users: []
      }));

      joinedRooms.delete(currentRoom);
      switchRoom("general");
    }

    function renderSidebar() {
      roomList.innerHTML = [...joinedRooms].map(([room, data]) => {
        const lastMsg = data.msgs[data.msgs.length - 1];
        const preview = lastMsg ? lastMsg.content : "Chưa có tin nhắn";
        const isActive = room === currentRoom ? "active" : "";
        return `
          <div class="room-item ${isActive}" onclick="switchRoom('${room}')">
            <div class="room-avatar">${roomAvatar(room)}</div>
            <div class="room-info">
              <div class="room-name">${displayRoomName(room)}</div>
              <div class="room-msg">${preview}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderMessages() {
      chatWindow.innerHTML = "";
      if (!currentRoom) return;
      const data = joinedRooms.get(currentRoom);
      if (data) data.msgs.forEach(renderMessage);
    }

    function renderMessage(msg) {
      const isNewUser = lastUser !== msg.username;
      
      if (msg.msg_type === "system") {
        const div = document.createElement("div");
        div.className = "msg-group system";
        div.innerHTML = `<div class="msg">${msg.content}</div>`;
        chatWindow.appendChild(div);
      } else {
        if (isNewUser && msg.username !== username) {
          const header = document.createElement("div");
          header.className = "msg-user-header";
          header.innerHTML = `
            <div class="msg-avatar">${msg.username[0].toUpperCase()}</div>
            <div class="msg-username">${msg.username}</div>
          `;
          chatWindow.appendChild(header);
        }

        const div = document.createElement("div");
        div.className = "msg-group" + (msg.username === username ? " own" : "");
        const msgEl = document.createElement("div");
        msgEl.className = "msg";
        msgEl.textContent = msg.content;
        div.appendChild(msgEl);
        chatWindow.appendChild(div);
      }

      lastUser = msg.username;
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function createRoomChat() {
      const name = prompt("Nhập tên phòng:");
      if (name) joinRoom(name.trim());
    }

    function createPrivateChat() {
      const target = prompt("Nhập username người nhận:");
      if (target && target.trim() !== username) {
        joinRoom(privateRoomId(username, target.trim()));
      }
    }
  </script>
</body>
</html>
